<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <p>Loading activities...</p>
        </div>
      </section>

      <div id="message" class="hidden" role="status" aria-live="polite"></div>

      <dialog id="signup-dialog" aria-labelledby="signup-dialog-title">
        <form id="signup-form">
          <h3 id="signup-dialog-title">Register for an activity</h3>
          <p id="signup-activity"></p>
          <div id="signup-feedback" class="hidden" role="alert"></div>
          <div class="form-group">
            <label for="email">Student email</label>
            <input
              type="email"
              id="email"
              required
              placeholder="your-email@mergington.edu"
            />
          </div>
          <div class="dialog-actions">
            <button type="button" id="cancel-signup" class="secondary-button">
              Cancel
            </button>
            <button type="submit">Register student</button>
          </div>
        </form>
      </dialog>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
